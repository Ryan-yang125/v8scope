[package]
name = "v8scope"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A Rust-first Node.js performance diagnostics toolkit"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Ryan-yang125/v8scope"
homepage = "https://github.com/Ryan-yang125/v8scope"
keywords = ["nodejs", "v8", "profiler", "performance", "diagnostics"]
categories = ["command-line-utilities", "development-tools::profiling"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
goose = { version = "0.18", default-features = false, features = ["rustls-tls"] }
hex = "0.4"
humantime = "2"
inferno = { version = "0.12.8", default-features = false }
process-wrap = { version = "9.1", features = ["tokio1"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
schemars = { version = "1.2", features = ["chrono04", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
sourcemap = "9.3"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "1.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webbrowser = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
assert_cmd = "2.2"
insta = { version = "1.48", features = ["json"] }
predicates = "3"
proptest = "1.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"

[package.metadata.dist]
dist = true

[[bin]]
name = "v8scope"
path = "src/main.rs"

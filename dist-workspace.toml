[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
# The checked-in workflow carries audited deltas: fixed `outputs` syntax and
# exact, locked Cargo installs in place of generated remote installer pipes.
allow-dirty = ["ci"]
ci = "github"
installers = ["shell", "npm", "homebrew"]
include = ["NOTICE.md", "licenses/"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
unix-archive = ".tar.xz"
npm-package = "v8scope"
publish-jobs = ["npm", "homebrew"]
tap = "Ryan-yang125/homebrew-tap"
install-path = "CARGO_HOME"
cargo-auditable = true
cargo-cyclonedx = true
github-attestations = true

[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"

[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"
